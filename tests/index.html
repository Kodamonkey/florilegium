<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florilegio · pruebas</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body { padding: 16px; font-family: var(--f-ui); max-width: 60rem; margin: 0 auto; }
  h1 { font-family: var(--f-display, inherit); font-weight: 500; margin: 0.2rem 0 0.4rem; }
  h2 { font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); margin: 1.6rem 0 0.4rem; }
  .sum { margin: 0; font-size: 0.95rem; }
  .sum.ok { color: #2f7d4a; } .sum.fail { color: #c0392b; }
  ol { list-style: none; padding: 0; margin: 0; font-size: 0.88rem; }
  li { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  li b { display: inline-block; min-width: 3.2rem; font-weight: 500; }
  li.ok b { color: #2f7d4a; } li.fail b { color: #c0392b; } li.skip b, li.run b { color: var(--ink-2); }
  li.fail { background: rgba(192, 57, 43, 0.07); }
  li small { display: block; margin-left: 3.2rem; color: var(--ink-2); white-space: pre-wrap; }
  #stage { margin-top: 0.8rem; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
  #stage:empty { display: none; }
  #stage iframe { border: 0; transform-origin: 0 0; background: var(--paper); }
</style>
</head>
<body>
<h1>Pruebas</h1>
<p class="sum" id="sum">Corriendo…</p>

<h2>Lógica (tests/specs.js)</h2>
<ol id="specs"></ol>

<h2>Jardín: visibilidad mínima ≥ 0,85 por tamaño</h2>
<ol id="garden"></ol>
<div id="stage"></div>

<script src="../js/core.js"></script>
<script src="../js/gen/data.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/art-a.js"></script>
<script src="../js/art-b.js"></script>
<script src="../js/art-c.js"></script>
<script src="../js/art-stems.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/bouquet-model.js"></script>
<script src="../js/bouquet-art.js"></script>
<script src="../js/meaning.js"></script>
<script src="../js/care.js"></script>
<!-- Solo para la prueba del filtro del mostrador (en Node se omite); no toca el DOM al cargar. -->
<script src="../js/showcase.js"></script>
<script src="specs.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const LABEL = { ok: 'ok', fail: 'FAIL', skip: 'skip', run: '…' };
  const row = (list, status, name, note) => {
    const li = document.createElement('li');
    li.className = status;
    li.innerHTML = '<b>' + LABEL[status] + '</b> ' + esc(name) + (note ? '<small>' + esc(note) + '</small>' : '');
    list.appendChild(li);
    return li;
  };
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const SIZES = [[1920, 1080], [1440, 900], [1280, 720], [1024, 768], [768, 1024], [375, 812]];

  // Carga el sitio en un iframe del mismo origen con ese tamaño y lee el informe del jardín.
  async function gardenAt(w, h) {
    const stage = $('stage'), k = Math.min(1, 320 / w);
    stage.style.width = Math.round(w * k) + 'px';
    stage.style.height = Math.round(h * k) + 'px';
    const fr = document.createElement('iframe');
    fr.width = w; fr.height = h;
    fr.style.transform = 'scale(' + k + ')';
    fr.title = 'Jardín a ' + w + '×' + h;
    const loaded = new Promise((res) => fr.addEventListener('load', res, { once: true }));
    fr.src = '../index.html';
    stage.appendChild(fr);
    try {
      await Promise.race([loaded, wait(15000)]);
      let rep = null;
      for (let t = 0; t < 150 && !rep; t++) {
        try { rep = fr.contentWindow.FL && fr.contentWindow.FL.garden && fr.contentWindow.FL.garden.report; } catch (e) { throw new Error('sin acceso al iframe (¿abierto desde file://? usa tools/serve.py)'); }
        if (!rep) await wait(100);
      }
      if (!rep) throw new Error('el jardín no publicó FL.garden.report');
      await wait(600); // por si un cambio de tamaño rehace el jardín
      rep = fr.contentWindow.FL.garden.report;
      return { minVis: rep.minVis, bands: rep.bands, tall: rep.tall, worst: rep.vis.slice().sort((a, b) => a.v - b.v).slice(0, 3) };
    } finally {
      fr.remove();
    }
  }

  (async () => {
    const specs = $('specs');
    const out = await window.FLTest.run((r) => row(specs, r.status, r.name, r.status === 'ok' ? '' : r.message));
    let gOk = 0, gFail = 0;
    const garden = $('garden');
    for (const [w, h] of SIZES) {
      const name = w + '×' + h;
      const li = row(garden, 'run', name, 'cargando…');
      try {
        const g = await gardenAt(w, h);
        const pass = g.minVis >= 0.85;
        pass ? gOk++ : gFail++;
        li.remove();
        row(garden, pass ? 'ok' : 'fail', name + ' · visibilidad mínima ' + g.minVis.toFixed(3),
          g.bands + ' filas' + (g.tall ? ' · modo alto' : '') + ' · menos visibles: ' + g.worst.map((x) => x.id + ' ' + x.v).join(', '));
      } catch (e) {
        gFail++;
        li.remove();
        row(garden, 'fail', name, e.message);
      }
    }
    const failed = out.failed + gFail;
    const sum = $('sum');
    sum.className = 'sum ' + (failed ? 'fail' : 'ok');
    sum.textContent = (out.passed + gOk) + ' ok, ' + failed + ' fallidas, ' + out.skipped + ' omitidas' +
      ' (lógica: ' + out.passed + '/' + (out.passed + out.failed) + ' · jardín: ' + gOk + '/' + SIZES.length + ')';
    document.title = (failed ? '✗ ' : '✓ ') + 'Florilegio · pruebas';
    window.FLTestDone = { specs: out, garden: { passed: gOk, failed: gFail } };
  })();
})();
</script>
</body>
</html>
